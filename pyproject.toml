[project]
name = "cairn"
version = "0.0.1"
description = "巨石堆 — 本地优先的个人知识 / 资产 / 项目工作台"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "HanYang06", email = "jihanyang123@163.com" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    # 载荷编解码：canonical CBOR——块记录与内容记录都靠它落到字节。
    "cbor2>=6.1.4",
]

# 已撤掉的声明（2026-10-02，判据是"一处引用都没有"）：
#   blake3 / cryptography / argon2-cffi —— 摘要取 sha256、库本地不加密，三者都没有调用点；
#   fastcdc —— 媒体定了固定粒度分片，不上内容定义分块；
#   pyyaml —— 表声明文件（`config/tables.yaml`）已取消，那是它唯一的用处；
#   tomli-w —— 同一条链上的 TOML 写出，随表声明一并没了。
# `cbor2` 留着：它是载荷的落盘形态，不是可替换的实现选择。

# 桌面外壳与前端不在本文件里：`app/` 是一份 Tauri 工程（`app/src-tauri/` 的 Cargo 工程
# ＋ `app/src/` 的 React 前端，同一个 pnpm 工程）。
# 原先的 `pyside6` 随 2026-09-30「Qt 退场」一并移除。
# **没有 `[project.scripts]`**：命令行入口的契约（库根旋钮名、子命令集、退出码口径）待作者裁定，
# 未定之前不占一个入口名。内核侧那一面在 `core/api.py`，边车在 `app/sidecar.py`。

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.16.10",
    "mypy>=2.4.0",
    "pyinstaller>=6.11",
    "pytest-cov>=7.1.0",
    "pre-commit>=4.6.2",
    "modelscope>=1.40.1",
    "mkdocs-material>=9.7",
    "mkdocstrings[python]>=1.0.6",
    "deptry>=0.25.1",
    "import-linter>=2.15",
    # 依赖 CVE 扫描（CI 的 security-scan 用）。与 import-linter 同类：
    # 只是"跑一次看看"的命令行工具，不由代码 import。
    "pip-audit>=2.10.1",
    # 传递依赖的下限，只为把 CVE 顶掉：`pre-commit` 会拉 `virtualenv`，
    # 而 21.7.10 有四个已知漏洞（PYSEC-2026-4011/4012/4013/4014，修复版 21.7.13）。
    # 写在这里比"等 pre-commit 自己放开"可靠——它是 CI 门禁真会拦的那条线。
    "virtualenv>=21.7.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.hatch.build.targets.wheel]
# Python 源码根是 `py_src/`（不叫 `src/`：仓里另有 `app/src/` 是 React 前端，两个 `src` 无法区分）。
# `core` 是内核、`model` 是领域层、`app` 是入口层（边车与命令行）。
# 列不存在的目录不会报错（hatch 静默跳过），但配置与事实不符本身就是尾巴。
packages = ["py_src/core", "py_src/model", "py_src/app"]

[tool.ruff]
target-version = "py313"
line-length = 100
# 第三方技能（vendored）保持上游原样，不参与本项目 lint。
extend-exclude = [".agents"]

[tool.ruff.lint]
# 企业级-ε：启用全部规则族，再按“有理由”的清单逐条豁免。
select = ["ALL"]
ignore = [
    # —— 与 ruff format 冲突（官方建议关闭，由格式化器负责）——
    "D203",   # 类定义前空行，与 D211 冲突
    "D213",   # 多行摘要从第二行开始，与 D212 冲突
    "COM812", # 缺尾随逗号
    "ISC001", # 单行隐式字符串拼接
    # —— 中文：文档/注释使用全角标点，规则误报 ——
    "RUF001", # 字符串中的易混淆 Unicode
    "RUF002", # docstring 中的易混淆 Unicode
    "RUF003", # 注释中的易混淆 Unicode
    # —— 注释：中文 docstring 以「。」结尾，该规则不认全角句号 ——
    "D415", # 首行以 . / ? / ! 结尾（中文句号误报）
    # —— docstring 只强制公共模块/类/函数，不强制每个方法 / dunder ——
    "D102", # 公共方法缺 docstring
    "D105", # 魔法方法缺 docstring
    "D107", # __init__ 缺 docstring
    # —— 边界处允许显式 Any；未注解 / 隐式 Any 由 mypy strict 把关 ——
    "ANN401",
    # —— 项目内部允许相对导入 ——
    "TID252",
    # —— 异常消息允许字面量 / f-string ——
    "EM101", "EM102", "TRY003",
    # —— 可读性阈值判断不算魔法数 ——
    "PLR2004",
    # —— 领域词汇：id / type / hash 是对外字段/方法名，改名会波及数据模型与 QML ——
    "A002", "A003",
]

[tool.ruff.lint.flake8-copyright]
# 本项目用 SPDX 头代替传统 Copyright 声明。
notice-rgx = "SPDX-FileCopyrightText: 2026 HanYang06"

[tool.ruff.lint.isort]
# `core` 是内核、`model` 是领域层、`app` 是入口层。三者都是本仓自己的包：
# 不列进来时 `from model.… import …` 会被当成第三方，与 `core` 分成两段即报 I001。
known-first-party = ["app", "core", "model"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# 注：这里**没有** `[tool.ruff.lint.flake8-type-checking]` 那一节。旧范式下块类型的
# `__init__` 体在构造时跑那些声明表达式，故要声明 `runtime-evaluated-base-classes`；
# 现值范式把声明写回类体，而注解一个都不求值（`Attr` / `Body` 只认字段名，不读注解），
# 故那一条按事实删掉——留着它会把"只给 mypy 看的领域类型"误判成运行期要用。

[tool.ruff.lint.per-file-ignores]
# 表名来自类名、列名来自 `ID_FIELDS`，两者都经 `Index._quote` 加引号，值全部参数化（无注入面）。
"py_src/core/storage/db/engine.py" = ["S608"]
# `conf` 的调用形是**对的形状本身就是契约**：声明与取值共用一个签名，`path` 之后全是可选副参数
# （类型 / 说明 / 文件引用 / 强写）。拆成小对象会把"一种调用形"这个卖点拆掉。
"py_src/core/conf/registry.py" = ["PLR0913"]
# `Attr(False)` 这类写法里那个布尔是**声明的默认值**，不是"给函数加开关的布尔位置参数"：
# 该规则防的是 `f(True, False)` 那种读不懂的调用，而 `Attr(<默认值>)` 恰恰是最清楚的写法。
"py_src/model/**" = ["FBT003"]
"tests/**" = ["ANN", "D", "S101", "S105", "S603", "PLR2004", "SLF001", "INP001", "FBT003"]
"tools/**" = ["ANN", "D", "S101", "S603", "C901", "PLR2004", "T201", "INP001", "ERA001"]
"scripts/**" = ["ANN", "D", "S101", "S603", "C901", "PLR2004", "T201", "INP001", "ERA001"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "py_src"
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.deptry]
known_first_party = ["core", "model"]
extend_exclude = ["app", "site", "docs", ".agents"]

# 注：这里**没有** `DEP002` 的豁免清单。旧稿列了六个"声明了没用"的包当例外，
# 那等于把盘点结果写成"已知问题"；它们已经撤掉声明，故清单也一并删了。
[tool.deptry.per_rule_ignores]
# `mypy` 是类型门禁本身要用的开发依赖，产品代码不 import 它。
DEP004 = ["mypy"]

[tool.importlinter]
root_packages = ["app", "core", "model", "tools"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core 是底座：不许依赖任何上层"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = ["model", "feature", "app", "net", "server"]

[[tool.importlinter.contracts]]
name = "core 必须 Qt-free"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = ["PySide6", "PySide2", "PyQt5", "PyQt6"]

[[tool.importlinter.contracts]]
name = "脚本不可被 import：core 与 tools 不许依赖 scripts"
type = "forbidden"
source_modules = ["core", "tools"]
forbidden_modules = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["py_src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=core",
    "--cov=model",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
]
# 企业级-ε：任何 warning 都视为错误（不得靠 suppress 蒙混）。
filterwarnings = ["error"]
