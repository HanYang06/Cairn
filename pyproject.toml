[project]
name = "cairn"
version = "0.0.1"
description = "巨石堆 — 本地优先的个人知识 / 资产 / 项目工作台"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "HanYang06", email = "jihanyang123@163.com" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "argon2-cffi>=25.1.0",
    "blake3>=1.0.9",
    "cbor2>=6.1.4",
    "cryptography>=50.0.1",
    "fastcdc>=1.7.0",
    "pyside6>=6.8",
    "pyyaml>=6.0.3",
    "tomli-w>=1.2.0",
]

# 桌面入口（`cairn = "ui.app:main"`）待 UI 重建后恢复。

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "pyinstaller>=6.11",
    "pytest-cov>=7.1.0",
    "pre-commit>=4.6.2",
    "modelscope>=1.40.1",
    "mkdocs-material>=9.7",
    "mkdocstrings[python]>=0.30",
    # mypy strict 下 PyYAML 需要类型存根
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.hatch.build.targets.wheel]
# 现在只有内核一层。`src/app` / `src/feature` / `src/ui_tools` 随各自重建加回——
# 列不存在的目录不会报错（hatch 静默跳过），但配置与事实不符本身就是尾巴。
packages = ["src/core"]

[tool.ruff]
target-version = "py313"
line-length = 100
# 第三方技能（vendored）保持上游原样，不参与本项目 lint。
extend-exclude = [".agents"]

[tool.ruff.lint]
# 企业级-ε：启用全部规则族，再按“有理由”的清单逐条豁免。
select = ["ALL"]
ignore = [
    # —— 与 ruff format 冲突（官方建议关闭，由格式化器负责）——
    "D203",   # 类定义前空行，与 D211 冲突
    "D213",   # 多行摘要从第二行开始，与 D212 冲突
    "COM812", # 缺尾随逗号
    "ISC001", # 单行隐式字符串拼接
    # —— 中文：文档/注释使用全角标点，规则误报 ——
    "RUF001", # 字符串中的易混淆 Unicode
    "RUF002", # docstring 中的易混淆 Unicode
    "RUF003", # 注释中的易混淆 Unicode
    # —— 注释：中文 docstring 以「。」结尾，该规则不认全角句号 ——
    "D415", # 首行以 . / ? / ! 结尾（中文句号误报）
    # —— docstring 只强制公共模块/类/函数，不强制每个方法 / dunder ——
    "D102", # 公共方法缺 docstring
    "D105", # 魔法方法缺 docstring
    "D107", # __init__ 缺 docstring
    # —— 边界处允许显式 Any；未注解 / 隐式 Any 由 mypy strict 把关 ——
    "ANN401",
    # —— 项目内部允许相对导入 ——
    "TID252",
    # —— 异常消息允许字面量 / f-string ——
    "EM101", "EM102", "TRY003",
    # —— 可读性阈值判断不算魔法数 ——
    "PLR2004",
    # —— 领域词汇：id / type / hash 是对外字段/方法名，改名会波及数据模型与 QML ——
    "A002", "A003",
]

[tool.ruff.lint.flake8-copyright]
# 本项目用 SPDX 头代替传统 Copyright 声明。
notice-rgx = "SPDX-FileCopyrightText: 2026 HanYang06"

[tool.ruff.lint.isort]
# 现在只有内核一层；`app` / `feature` / `ui_tools` 随各自重建加回。
known-first-party = ["core"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# 表名/列名来自声明层（tables.py）并经 quote_identifier 加引号，值全部参数化（无注入面）。
"src/core/storage/rows.py" = ["S608"]
"src/core/storage/index.py" = ["S608"]
# `conf` 的调用形是**对的形状本身就是契约**：声明与取值共用一个签名，`path` 之后全是可选副参数
# （类型 / 说明 / 文件引用 / 强写）。拆成小对象会把"一种调用形"这个卖点拆掉。
"src/core/conf/registry.py" = ["PLR0913"]
# 测试与工具脚本：断言、注解、docstring、魔法数、打印等不按产品代码要求。
# `FBT003` 也放行：配置面就是 `conf(键, 值)` 这种位置调用，测试里写布尔字面量是"取值"而非开关。
"tests/**" = ["ANN", "D", "S101", "S105", "S603", "PLR2004", "SLF001", "INP001", "FBT003"]
"tools/**" = ["ANN", "D", "S101", "S603", "C901", "PLR2004", "T201", "INP001", "ERA001"]

[tool.mypy]
python_version = "3.13"
# 企业级-ε：类型按静态语言口径，未注解 / 隐式 Any / Any 泄漏一律报错。
strict = true
plugins = ["tools/mypy_plugin.py"]

# 两个退役工具：它们依赖的层（`app` / `ui_tools` / 旧配置引擎）在本次重建里被整条删除，
# 故现在既跑不起来、也过不了类型检查。文件留着当参考（各自的 docstring 写明了状态），
# 这里显式放行以免整仓 mypy 门禁被这两处拖红；不放进 `exclude` 是为了让它们仍在检查范围内
# ——一旦被谁 import，或被修回可运行，就该把它们从这个豁免里摘出去。
[[tool.mypy.overrides]]
module = ["tools.preview_shell", "tools.gen_conf"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=core",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
]
# 企业级-ε：任何 warning 都视为错误（不得靠 suppress 蒙混）。
filterwarnings = ["error"]
