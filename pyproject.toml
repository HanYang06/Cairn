[project]
name = "cairn"
version = "0.0.1"
description = "巨石堆 — 本地优先的个人知识 / 资产 / 项目工作台"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "HanYang06", email = "jihanyang123@163.com" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "argon2-cffi>=25.1.0",
    "blake3>=1.0.9",
    "cbor2>=6.1.4",
    "cryptography>=50.0.1",
    "fastcdc>=1.7.0",
    "pyyaml>=6.0.3",
    "tomli-w>=1.2.0",
]

# 桌面外壳与前端不在本文件里：`app/` 是一份 Tauri 工程（`app/src-tauri/` 的 Cargo 工程
# ＋ `app/src/` 的 React 前端，同一个 pnpm 工程）。
# 原先的 `pyside6` 随 2026-09-30「Qt 退场」一并移除。
# 命令入口的脚本声明见下方 `[project.scripts]`。

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "pyinstaller>=6.11",
    "pytest-cov>=7.1.0",
    "pre-commit>=4.6.2",
    "modelscope>=1.40.1",
    "mkdocs-material>=9.7",
    "mkdocstrings[python]>=0.30",
    # mypy strict 下 PyYAML 需要类型存根
    "types-pyyaml>=6.0.12",
    "deptry>=0.25.1",
    "import-linter>=2.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.hatch.build.targets.wheel]
# Python 源码根是 `py_src/`（不叫 `src/`：仓里另有 `app/src/` 是 React 前端，两个 `src` 无法区分）。
# `core` 是内核、`app` 是入口层（边车与命令行）；`feature` 待重建——
# 列不存在的目录不会报错（hatch 静默跳过），但配置与事实不符本身就是尾巴。
packages = ["py_src/core", "py_src/app"]

[tool.ruff]
target-version = "py313"
line-length = 100
# 第三方技能（vendored）保持上游原样，不参与本项目 lint。
extend-exclude = [".agents"]

[tool.ruff.lint]
# 企业级-ε：启用全部规则族，再按“有理由”的清单逐条豁免。
select = ["ALL"]
ignore = [
    # —— 与 ruff format 冲突（官方建议关闭，由格式化器负责）——
    "D203",   # 类定义前空行，与 D211 冲突
    "D213",   # 多行摘要从第二行开始，与 D212 冲突
    "COM812", # 缺尾随逗号
    "ISC001", # 单行隐式字符串拼接
    # —— 中文：文档/注释使用全角标点，规则误报 ——
    "RUF001", # 字符串中的易混淆 Unicode
    "RUF002", # docstring 中的易混淆 Unicode
    "RUF003", # 注释中的易混淆 Unicode
    # —— 注释：中文 docstring 以「。」结尾，该规则不认全角句号 ——
    "D415", # 首行以 . / ? / ! 结尾（中文句号误报）
    # —— docstring 只强制公共模块/类/函数，不强制每个方法 / dunder ——
    "D102", # 公共方法缺 docstring
    "D105", # 魔法方法缺 docstring
    "D107", # __init__ 缺 docstring
    # —— 边界处允许显式 Any；未注解 / 隐式 Any 由 mypy strict 把关 ——
    "ANN401",
    # —— 项目内部允许相对导入 ——
    "TID252",
    # —— 异常消息允许字面量 / f-string ——
    "EM101", "EM102", "TRY003",
    # —— 可读性阈值判断不算魔法数 ——
    "PLR2004",
    # —— 领域词汇：id / type / hash 是对外字段/方法名，改名会波及数据模型与 QML ——
    "A002", "A003",
]

[tool.ruff.lint.flake8-copyright]
# 本项目用 SPDX 头代替传统 Copyright 声明。
notice-rgx = "SPDX-FileCopyrightText: 2026 HanYang06"

[tool.ruff.lint.isort]
# `core` 是内核、`app` 是入口层；`feature` 随领域层重建加回。
known-first-party = ["app", "core"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# 表名/列名来自声明层（tables.py）并经 quote_identifier 加引号，值全部参数化（无注入面）。
"py_src/core/storage/rows.py" = ["S608"]
"py_src/core/storage/index.py" = ["S608"]
# `conf` 的调用形是**对的形状本身就是契约**：声明与取值共用一个签名，`path` 之后全是可选副参数
# （类型 / 说明 / 文件引用 / 强写）。拆成小对象会把"一种调用形"这个卖点拆掉。
"py_src/core/conf/registry.py" = ["PLR0913"]
# 表声明层要问"配置在哪"：`core.conf` 在函数里导入，免得"导入存储"就得先有配置文件在那儿。
"py_src/core/storage/tables.py" = ["PLC0415"]
# 测试与脚本：断言、注解、docstring、魔法数、打印等不按产品代码要求。
# `FBT003` 也放行：配置面就是 `conf(键, 值)` 这种位置调用，测试里写布尔字面量是"取值"而非开关。
# `scripts/**` 另需 `INP001`：那里**故意不放 `__init__.py`**（不成包 ⇒ 结构上不可 import）。
"tests/**" = ["ANN", "D", "S101", "S105", "S603", "PLR2004", "SLF001", "INP001", "FBT003"]
"tools/**" = ["ANN", "D", "S101", "S603", "C901", "PLR2004", "T201", "INP001", "ERA001"]
"scripts/**" = ["ANN", "D", "S101", "S603", "C901", "PLR2004", "T201", "INP001", "ERA001"]

[tool.mypy]
python_version = "3.13"
# 企业级-ε：类型按静态语言口径，未注解 / 隐式 Any / Any 泄漏一律报错。
strict = true
plugins = ["tools/mypy_plugin.py"]
# 源码根要显式指给 mypy：它不读 pytest 的 `pythonpath`，不指路时 `core` 会被认成
# site-packages 里缺 `py.typed` 的第三方包，于是测试侧的 `core.*` 全成 Any——
# 报错数看着不少，判据却已经失效。指路之后单独跑 `mypy tests` 也是同一口径。
mypy_path = "py_src"

# 原先这里给 `tools.preview_shell` 开了豁免（它依赖已删除的 `app` / `ui_tools`）。
# 2026-09-30「Qt 退场」之后该文件已删除：它按新材质**永远不会恢复**，
# 留着会一直让 `ruff check .` 报 I001（import 分块顺序），故与 Qt 一并清掉。
# 打包脚本 `scripts/build.py` 的豁免同批摘除，见该文件 docstring 的状态说明。

# 测试纳入扫描，但不强求函数签名注解（与 ruff 对 `tests/**` 豁免 `ANN` 同一口径）：
# 236 个 `def test_*` 补 `-> None` 属机械改动，带来的常驻摩擦大于收益。
# 放行的只是签名；`check_untyped_defs` 仍在 strict 内，函数体照常受检，
# 对 `core.*` 的参数类型、返回类型、属性名的判据一条不少。
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.deptry]
# 本项目的源码根是 `py_src/`（不叫 `src/`），deptry 认不出 `core` 是本仓自己的包；
# 不指路就会把它当成传递依赖，一次报几十条 DEP003。
known_first_party = ["core"]
# 前端、文档产物、虚拟环境与 vendored 技能不参与 Python 依赖盘点。
extend_exclude = ["app", "site", "docs", ".agents"]

[tool.deptry.per_rule_ignores]
# 已声明、尚未接线：这些依赖随各自模块重建才会用上（`progress.md` 有记录）。
# 冻结已知项，门禁便能拦住**新增**的未用依赖——这才是它存在的意义。
DEP002 = ["argon2-cffi", "blake3", "cryptography", "fastcdc", "tomli-w"]
# `tools/mypy_plugin.py` 是 mypy 插件，本就依赖开发依赖。
DEP004 = ["mypy"]

[tool.importlinter]
# 架构校验：把"分层"与"内核 Qt-free"变成机器拦得住的规矩（`uv run lint-imports`）。
# **配置放这里而不是 `.importlinter`**：后者由 import-linter 按系统默认编码读取，
# 在 Windows（cp936）下遇到中文即解码失败——本文件按 UTF-8 读，没有这个问题。
# `tools` 也要列进根包：`lint-imports` 是控制台脚本，跑起来时仓根**不在** `sys.path` 上，
# 只列 `core`（它已装进虚拟环境）时，契约里一写 `tools` 就会报"模块不存在"。
root_packages = ["app", "core", "tools"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core 是底座：不许依赖任何上层"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = ["model", "feature", "app", "net", "server"]

[[tool.importlinter.contracts]]
name = "core 必须 Qt-free"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = ["PySide6", "PySide2", "PyQt5", "PyQt6"]

[[tool.importlinter.contracts]]
name = "脚本不可被 import：core 与 tools 不许依赖 scripts"
type = "forbidden"
source_modules = ["core", "tools"]
forbidden_modules = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["py_src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=core",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
]
# 企业级-ε：任何 warning 都视为错误（不得靠 suppress 蒙混）。
filterwarnings = ["error"]
