#
# REUSE 集中清单（REUSE 规范的 `REUSE.toml`，取代旧的 `.reuse/dep5`）。
#
# 它只负责一类文件：**装不下内联 SPDX 头的**——二进制素材、JSON（没有注释语法）、
# 锁文件与生成物、法律文书本身、以及第三方 vendored 技能。
# 能写内联头的源文件 / 文档仍写内联头，由 `scripts/spdx.py` 负责插入与检查。
#
# 注意：`reuse` 那个 CLI 工具本体是 GPL-3.0-or-later，与本项目红线冲突，故**不引入**；
# 这里采用的只是它定义的**数据格式**，由本仓库自己的 `scripts/spdx.py` 读写。

version = 1

# —— 自有素材与数据：图标 / 启动图 / 主题与图形集 / 配置投影 / 编辑器配置 ——
[[annotations]]
path = [
  "assets/**",
  "config/**",
  ".vscode/**",
  "skills-lock.json",
]
SPDX-FileCopyrightText = "2026 HanYang06"
SPDX-License-Identifier = "Apache-2.0"

# —— 工具与生成物：库锁、Python 版本、文档站构建产物 ——
# `.gitignore` / `.gitattributes` / `.editorconfig` 能写 `#` 注释，故仍写内联头（由 scripts/spdx.py
# 按文件名认领并校验），不进这份清单。
# `site/**` 是 `mkdocs build` 的产物（已 gitignore）；这里声明只是兜底——
# `scripts/spdx.py` 走 `git ls-files`，本来就不会把它算进"无主文件"。
[[annotations]]
path = [
  "uv.lock",
  ".python-version",
  "site/**",
]
SPDX-FileCopyrightText = "2026 HanYang06"
SPDX-License-Identifier = "Apache-2.0"

# —— 编辑器模板扩展（TrevorNesbitt.smart-file-templates，MIT）的配置 ——
[[annotations]]
path = [".fileTemplates.json"]
SPDX-FileCopyrightText = "2026 HanYang06"
SPDX-License-Identifier = "Apache-2.0"

# —— 桌面外壳工程（`app/`）：装不下内联头的那些 ——
# 本项目的工程文件（JSON / 数据格式 / 锁文件）与自有图形资源。
# 前端源码本身（`.tsx` / `.ts` / `.css`）与 Rust（`.rs`）走内联头，由 `scripts/spdx.py` 校验。
[[annotations]]
path = [
  "app/package.json",
  "app/pnpm-lock.yaml",
  "app/tsconfig.json",
  "app/tsconfig.node.json",
  "app/biome.json",
  "app/.vscode/**",
  "app/src/assets/**",
  "app/src-tauri/Cargo.toml",
  "app/src-tauri/Cargo.lock",
  "app/src-tauri/tauri.conf.json",
  "app/src-tauri/capabilities/**",
]
SPDX-FileCopyrightText = "2026 HanYang06"
SPDX-License-Identifier = "Apache-2.0"

# `app/src-tauri/icons/**` 由 `pnpm tauri icon ../assets/logo/cairn-icon.png` 生成，
# 源头是项目自有图形（`assets/logo/**`），故与项目同档。
[[annotations]]
path = ["app/src-tauri/icons/**"]
SPDX-FileCopyrightText = "2026 HanYang06"
SPDX-License-Identifier = "Apache-2.0"

# —— 法律文书本身（不给自己加头）——
[[annotations]]
path = [
  "LICENSE",
  "NOTICE",
]
SPDX-FileCopyrightText = "2026 HanYang06"
SPDX-License-Identifier = "Apache-2.0"

# —— 第三方 vendored 技能：保持上游原样，许可依上游 ——
# 来源与 hash 见 `skills-lock.json`。
[[annotations]]
path = [".agents/skills/skill-creator/**"]
SPDX-FileCopyrightText = "Anthropic, PBC"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = [".agents/skills/git-commit/**"]
SPDX-FileCopyrightText = "GitHub, Inc."
SPDX-License-Identifier = "MIT"
