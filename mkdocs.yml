#
# 文档站配置（MkDocs + Material）——**生成物，不入库**：`site/` 被 gitignore。
# 事实源仍是 `docs/**/*.md`（手写）与 `src/**` 的 docstring（自动抽取）。
# 本地预览：`uv run mkdocs serve`；门禁：`uv run mkdocs build --strict`。

site_name: Cairn · 巨石堆
site_description: 本地优先的内容寻址对象池 / 笔记 · 资产 · 项目工作台
site_url: https://hanyang06.github.io/cairn/
repo_url: https://github.com/HanYang06/cairn
repo_name: HanYang06/cairn
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2026 HanYang06 · Apache-2.0

theme:
  name: material
  language: zh
  features:
    - content.action.edit
    - content.code.copy
    - content.tabs.link
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    # 色盘照 GitHub（与 `config/theme/*.json` 同源），先浅后深、跟随系统
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: 切换到深色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: 切换到浅色
  icon:
    repo: fontawesome/brands/github

nav:
  - 首页: index.md
  - 向导:
      - 快速开始: guides/quickstart.md
      - 参与开发: guides/development.md
      - 约定与红线: guides/conventions.md
  - 架构:
      - architecture/index.md
      - 总纲（数据结构）: architecture/data-model.md
      - L0 存储设计: architecture/storage-design.md
      - 内核规格: architecture/kernel-spec.md
      - 内核: architecture/kernel.md
      - 领域: architecture/domains.md
      - 配置引擎: architecture/config.md
      - 笔记模型: architecture/note-model.md
      - 内嵌资源: architecture/access.md
      - UI 内核: architecture/ui-kernel.md
      - UI 主题: architecture/ui-theme.md
      - 设计档案: architecture/by-design.md
      - 网络与联邦: architecture/network.md
      - 生态与插件: architecture/ecosystem.md
      - 内核 M1 计划: architecture/kernel-m1-plan.md
  - API 参考:
      - api/index.md
      - core（底座）: api/core.md
      - feature（领域）: api/feature.md
      - ui_tools（界面工具层）: api/ui-tools.md
      - app（应用组合根）: api/app.md
  - 术语: reference/glossary.md
  - 配置项参考: reference/config.md
  - 贡献:
      - contributing/index.md
      - 怎么改文档: contributing/docs.md
      - 许可与署名: contributing/license.md
  - 博客:
      - 滚轮选择器与物理引擎: blog/wheel-picker-physics-engine.md

plugins:
  - search:
      lang:
        - zh
        - en
  - mkdocstrings:
      handlers:
        python:
          # 让 `::: core` 这类指令去 `src/` 找包（顶层包去 `cairn.` 前缀，见 AGENTS.md）
          paths: [src]
          options:
            docstring_style: google
            docstring_options:
              ignore_init_summary: true
            merge_init_into_class: true
            show_if_no_docstring: false
            show_root_full_path: false
            show_root_heading: true
            show_signature_annotations: true
            show_source: true
            show_submodules: true
            separate_signature: true
            filters:
              - "!^_[^_]"
              - "!^__"

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      # 架构文档里有 mermaid 图（如 `data-model.md` §0.2），交给 Material 自带的 mermaid 集成渲染
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/HanYang06/cairn
      name: GitHub 仓库

strict: true
