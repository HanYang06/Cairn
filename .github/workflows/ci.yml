name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: License headers (SPDX)
        run: uv run python tools/spdx.py --check

      # 书面语：文档 / 注释一律非口语化，**阻断式**（全仓已清零）。标准见 rules/references/prose.md，
      # 词典本体在 tools/prose.py；行首三叹号是 MkDocs admonition 语法，词典已按位置排除。
      - name: Prose check (书面语)
        run: uv run python tools/prose.py

      # 配置投影（config/settings.json 与 config/schema/settings.json）**没有生成脚本**：
      # 跑一遍程序就顺带生成，入库的产物与声明是否分叉由 pytest 的投影契约用例拦住
      # （`tests/core/test_conf_projection.py`）。详情见 docs/architecture/config.md。

      - name: Generated config reference (no drift)
        run: uv run python tools/docgen.py --check

      # 报告模式：`DOCSTRING_MIN` 是既定阈值，但当前覆盖率未达标，故不阻断。
      # 达标后把这一步改成 `docgen.py --coverage --gate` 即成为门禁（与 prose 步同款两段式）。
      - name: Docstring coverage report (报告模式)
        run: uv run python tools/docgen.py --coverage

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy strict)
        run: uv run mypy py_src tools tests

      - name: Tests with coverage gate
        run: uv run pytest --cov-fail-under=80

  # 前端门禁：与上面那组（Python 七道）同等地位。规矩与门禁的对照表见
  # `.agents/skills/rules/references/frontend.md` §四；入口只有一个 `pnpm check`。
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install (lockfile 即事实源)
        run: pnpm install --frozen-lockfile

      - name: Checks (类型 / lint / 样式 / 架构 / 令牌 / 单测)
        run: pnpm check
