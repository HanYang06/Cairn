name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      QSG_RHI_BACKEND: software
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: License headers (SPDX)
        run: uv run python tools/spdx.py --check

      # 书面语：文档 / 注释一律非口语化，**阻断式**（全仓已清零）。标准见 rules/references/prose.md，
      # 词典本体在 tools/prose.py；行首三叹号是 MkDocs admonition 语法，词典已按位置排除。
      - name: Prose check (书面语)
        run: uv run python tools/prose.py

      # 配置投影（config/ 与 schema/）的防漂移这一步**暂缺**：它的工具 `tools/gen_conf.py`
      # 依赖的配置引擎在 2026-09-29 的重建里被删除，正由作者在新结构下重做（`src/core/conf/`）。
      # 引擎落地后把这步加回来（工具修回时记得摘掉 pyproject 里给它的 mypy 豁免）：
      #
      #     # 两个投影（config/ 与 schema/）是否与声明一致：docgen 只比参考页，投影漂移看这里
      #     - name: Config projections (no drift)
      #       run: uv run python tools/gen_conf.py --check

      - name: Generated config reference (no drift)
        run: uv run python tools/docgen.py --check

      # 报告模式：`DOCSTRING_MIN` 是既定阈值，但当前覆盖率未达标，故不阻断。
      # 达标后把这一步改成 `docgen.py --coverage --gate` 即成为门禁（与 prose 步同款两段式）。
      - name: Docstring coverage report (报告模式)
        run: uv run python tools/docgen.py --coverage

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy strict)
        run: uv run mypy src tools

      - name: Tests with coverage gate
        run: uv run pytest --cov-fail-under=80
