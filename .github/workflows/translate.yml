#
# 英文译文：中文是事实基础（作者亲手写），英文是**机器翻译的产物**。
# 口径见 `docs/reference/i18n-status.md` 与 `.agents/skills/rules/references/docs.md`「多语言文档」。
#
# 三件事分开跑，因为它们的前提不同：
#
# - **`drift`（不需要凭证）**：中文改了、英文没跟上就红。这是门禁，可在分支上立刻看到。
# - **`probe`（需要凭证，只读）**：同仓库分支的 PR 上只送两个字符验端点。单拉一 job 的
#   理由是下面那条：`translate` 在 PR 上被 `if` 跳过，若探针只住在它里面，"请求装配改对了
#   没有"在分支上就永远没有答案——只能等合并后在主干上第一次真跑（红过两次就是这么来的）。
# - **`translate`（需要阿里云凭证）**：补译缺失的页，**开 PR** 交人工校术语，不直推 `main`。
#
# 凭证（仓库 secret，二选一的名字都对不上就整个跳过）：
#   ALIBABA_CLOUD_ACCESS_KEY_ID / ALIBABA_CLOUD_ACCESS_KEY_SECRET
# 建议给这对 AK 只授 `alimt:TranslateGeneral`（RAM 最小权限），不要用主账号 AK。
#
# 额度：机器翻译通用版对**主账号每月 100 万字符**免费，超出 50 元/百万字符。
# 本站中文原文约 9.5 万字符，全部译一遍只占免费额度的 10%。
# 参考：https://help.aliyun.com/zh/machine-translation/product-overview/pricing-of-machine-translation-general-purpose-edition

name: translate

on:
  # PR 上只做漂移检查（无凭证也能跑）
  pull_request:
    paths:
      - "docs/**"
      - "scripts/translate.py"
      - ".github/workflows/translate.yml"
  # 主干上补译 → 开 PR。
  # **不含工作流自己那条路径**：改 CI 不该花额度去补译（PR 那侧仍含它，好让改动在合并前被跑到）。
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/translate.py"
  workflow_dispatch:
    inputs:
      base:
        description: "译文的 PR 目标分支（留空 = 触发这份工作流的分支）"
        required: false
        type: string
      dry:
        description: "只跑补译、不提交不开 PR（在分支上验装配用；真调接口，会耗额度）"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: translate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: drift (译文是否落后)
    # **只在 PR 上扫**：合入 main 的那次 push 与 PR 上那次是同一棵树（merge 与 squash 都是），
    # 再扫一遍是纯重复；主干上"还差几页"的信号由 `translate` job 的日志给（它会打印待译页数）。
    # 若哪天改成 rebase 合并、或允许直推 main，PR 那次就不再覆盖 main，那时把这一行去掉即可。
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      # 20 页全部译完（2026-10-10），故这里就是**真门禁**：中文改了而英文没跟上即红。
      # `--report` 是"译文还没补齐"时的过渡态（同判据、不判失败），现已不用。
      # 也别改用 `continue-on-error`：写在 step 上与 job 级都不改 job 结论，实测两次仍报 failure。
      - name: Translation drift
        run: uv run python scripts/translate.py --check

      - name: Pending pages (always visible in the log)
        run: uv run python scripts/translate.py --list

  probe:
    name: probe (端点自检)
    # 只跑同仓库分支的 PR：fork 的 PR 事件拿不到 secret（拿不到时那一步本来也会跳过，
    # 这里只是把意图写明，并省下一次空转的 runner）。
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Check credentials
        id: creds
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
        run: |
          if [ -n "$ALIBABA_CLOUD_ACCESS_KEY_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 ALIBABA_CLOUD_ACCESS_KEY_ID，跳过探针。"
          fi

      # 与 `translate` job 里那一步同一命令：只送两个字符，不写任何文件、不开 PR。
      - name: Probe the endpoint
        if: steps.creds.outputs.ready == 'true'
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: uv run python scripts/translate.py --probe

  translate:
    name: translate (补译 → 开 PR)
    # 只在主干推送或手动触发上跑：PR 上不产生新的提交，免得来回打架
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Check credentials
        id: creds
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
        run: |
          if [ -n "$ALIBABA_CLOUD_ACCESS_KEY_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 ALIBABA_CLOUD_ACCESS_KEY_ID，跳过补译。"
          fi

      # 先探针后翻译：探针只送两个字符，却能一次说清"凭证对不对、签名认不认、端点通不通"。
      # 它失败即整个 job 失败（这正是想要的：带着诊断信息的红，比译到一半炸更好查）。
      - name: Probe the endpoint
        if: steps.creds.outputs.ready == 'true'
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: uv run python scripts/translate.py --probe

      - name: Translate
        id: run
        if: steps.creds.outputs.ready == 'true'
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: uv run python scripts/translate.py

      # `dry`（手动触发才有）：真调接口把整批译一遍，但**不改版本库**——用来在分支上
      # 把"补译这条路"整条走通（主线只有 push 才跑它，故这是合并前唯一能真跑的场合）。
      - name: Open a pull request
        if: steps.creds.outputs.ready == 'true' && inputs.dry != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 译文**不推回触发它的分支**：那会让工作流变成第二个写者。
          # 产出永远落在自己的 i18n 分支上，PR 的目标取"当前 ref"（或手动指定）。
          BASE_REF: ${{ inputs.base || github.ref_name }}
        run: |
          if [ -z "$(git status --porcelain docs)" ]; then
            echo "::notice::没有新译文，无需开 PR。"
            exit 0
          fi
          branch="i18n/machine-translation-${GITHUB_RUN_NUMBER}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add docs
          git commit -m "docs(i18n): 补机器翻译的英文译文"
          git push origin "$branch"
          # 推完分支**别立刻开 PR**：实测有一次 PR 事件在创建那一秒就失败，GitHub 给的理由是
          # "workflow file issue"，而那次 `jobs` 数是 **0**（run 38005731459 / 38005731431，
          # head 正是刚推上去的那个提交）——同一个分支下一次 push 再跑就全绿。等一会儿，
          # 让 GitHub 先索引到分支上的工作流文件，免得机器人开出的 PR 头一次检查是红的。
          sleep 20
          body="由 \`scripts/translate.py\`（阿里云机器翻译通用版）生成。"
          body="$body"$'\n\n'"**请人工过一遍术语**：块 / 槽 / 载体 / 摘要 / 落点 这几个词在任何语境下都必须是同一个译法（对照 \`docs/reference/glossary.md\`）。"
          body="$body"$'\n\n'"机翻只译正文；代码块、链接路径与导航标签原样保留。"
          gh pr create \
            --base "$BASE_REF" \
            --head "$branch" \
            --title "docs(i18n): 补机器翻译的英文译文" \
            --body "$body"
