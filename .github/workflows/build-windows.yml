name: build-windows

# **暂挂**：打包链路（`scripts/build.py` + `packaging/cairn.spec`）依赖已被删除的应用入口
# `src/app`，而 UI 外壳待重建（见 `.agents/skills/memory/progress.md`「内核重建」）。
# 故这里只留手动触发——打标签不再触发它，否则一次发布就会卡在一个注定失败的作业上。
# UI 外壳回来、打包脚本修回之后，把 `push: tags` 一并恢复。
on:
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build package and installer
        run: uv run python scripts/build.py --clean --installer

      - name: Upload portable bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cairn-windows-portable
          path: dist/cairn/

      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cairn-windows-installer
          path: dist/installer/*.exe
