name: build-windows

# **暂挂**：打包链路（`scripts/build.py` + `packaging/cairn.spec`）依赖已被删除的应用入口
# `src/app`，而 UI 外壳待重建（见 `.agents/skills/memory/progress.md`「内核重建」）。
# 故这里只留手动触发——打标签不再触发它，否则一次发布就会卡在一个注定失败的作业上。
# UI 外壳回来、打包脚本修回之后，把 `push: tags` 一并恢复。
on:
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build package and installer
        run: uv run python scripts/build.py --clean --installer

      - name: Upload portable bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cairn-windows-portable
          path: dist/cairn/

      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cairn-windows-installer
          path: dist/installer/*.exe
