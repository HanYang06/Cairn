#
# 文档站：构建（严格模式）-> 发 GitHub Pages。
#
# 一次性准备：仓库 Settings -> Pages -> Build and deployment -> Source 选 **GitHub Actions**。
# 站点地址：https://hanyang06.github.io/cairn/ （`mkdocs.yml` 的 `site_url` 与此对应）。

name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "py_src/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
      - "LICENSE"
      - "NOTICE"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "py_src/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
      - "LICENSE"
      - "NOTICE"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# 同一分支的重复触发只保留最新一次；但**不要取消发布中的任务**（否则可能留下半套站点）
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      # `--strict`：坏链接 / 未登记页面 / 未知配置一律失败——文档不许悄悄腐化
      - name: Build docs (strict)
        run: uv run mkdocs build --strict

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    # 只在主干（或手动触发）发布；PR 仅做构建门禁
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
