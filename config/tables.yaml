#
# 索引库的表声明。**这份文件由代码写出来**：谁用了 ID，谁的名字就在这里（设计篇 §8）。
# 引擎在开库时读它、把它编译成建表语句；人也能改它——加了什么，引擎下次只补不删。
#
# 列的来路三种写法：
#   id().字段       本行主语的 ID 字段（列名就是字段名，类型随 ID 走）
#   id(名字).字段   指向别处的指针（只带两套凭证，列名加名字前缀）
#   { name, from, type, doc }  存储层观测（store）/ 程序给出（prog）/ 派生（digest）

- name: block
  doc: "存储单元：身份壳加自包含属性。"
  tier: derived
  owner: core
  rebuild_from: "载体记录头（设计篇 §8.5 档一）"
  columns:
    - id().value_uuid
    - id().value_hash
    - id().birth_time·
    - id().name
    - id(body).value_uuid
    - id(body).value_hash
    - { name: kind, from: prog, type: text, doc: 类型标号；由程序给出，不在记录头里 }
    - { name: hub, from: store, type: text, not_null: True, doc: 所属 hub（目录名） }
    - { name: pack, from: store, type: text, not_null: True, doc: 载体文件名 }
    - { name: slot_first, from: store, type: integer, not_null: True, doc: 起始格（两数格模型的第一个数字） }
    - { name: slot_last, from: store, type: integer, not_null: True, doc: 末格（闭区间上界） }
    - { name: size, from: store, type: integer, not_null: True, doc: 记录字节数，便于估算与巡检 }
    - { name: created, from: store, type: integer, doc: 第一次落盘时刻（unix 毫秒） }
    - { name: updated, from: store, type: integer, doc: 最近一次改写时刻（unix 毫秒） }
  primary_key: [value_uuid]

- name: body
  doc: "数据载荷载体。"
  tier: derived
  owner: core
  rebuild_from: "载体记录头（设计篇 §8.5 档一）"
  columns:
    - id().value_uuid
    - id().value_hash
    - id().birth_time
    - id().name
    - { name: hub, from: store, type: text, not_null: True, doc: 所属 hub（目录名） }
    - { name: pack, from: store, type: text, not_null: True, doc: 载体文件名 }
    - { name: slot_first, from: store, type: integer, not_null: True, doc: 起始格（两数格模型的第一个数字） }
    - { name: slot_last, from: store, type: integer, not_null: True, doc: 末格（闭区间上界） }
    - { name: size, from: store, type: integer, not_null: True, doc: 记录字节数，便于估算与巡检 }
    - { name: created, from: store, type: integer, doc: 第一次落盘时刻（unix 毫秒） }
    - { name: updated, from: store, type: integer, doc: 最近一次改写时刻（unix 毫秒） }
  primary_key: [value_uuid]

- name: hub
  doc: "登记表：主语是载体目录、不是 ID；真源是目录本身"
  tier: derived
  owner: core
  rebuild_from: "vault 下的 hub 目录（设计篇 §6）"
  columns:
    - { name: name, from: store, type: text, not_null: True, doc: hub 名（目录名） }
    - { name: role, from: store, type: text, not_null: True, doc: 主 hub / 短命 hub；短命 hub 为未来项 }
    - { name: state, from: store, type: text, not_null: True, doc: 登记状态；合并期为未来项 }
    - { name: created, from: store, type: integer, not_null: True, doc: 第一次见到它的时刻（unix 毫秒） }
  primary_key: [name]

- name: edge
  doc: "关系表：一行一条；两端各指一个 ID，关系不需要第二种语法"
  tier: derived
  owner: core
  rebuild_from: "关系数据落在块内时的块记录（设计篇 §8.2 注；归属待定）"
  columns:
    - { name: id, from: digest, type: text, not_null: True, doc: 边身份摘要（由下列各列算出） }
    - id(src).value_uuid
    - id(dst).value_uuid
    - { name: kind, from: prog, type: text, not_null: True, doc: 关系种类 }
    - { name: domain, from: prog, type: text, not_null: True, doc: 所属领域 }
    - { name: created, from: store, type: integer, not_null: True, doc: 建立时刻（unix 毫秒） }
  primary_key: [id]
  indexes:
    - { columns: [src_value_uuid, kind], doc: 出边（正向遍历） }
    - { columns: [dst_value_uuid, kind], doc: 反查（backlinks） }
