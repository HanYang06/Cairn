# SPDX 头 -> 书面语 -> ruff -> mypy。测试与覆盖率门禁在 CI。
default_install_hook_types: [pre-commit]
repos:
  - repo: local
    hooks:
      # SPDX 头：缺了自动补（补完需重新 git add）。装不下头的文件走 REUSE.toml 集中声明。
      - id: spdx-headers
        name: SPDX headers
        entry: uv run python tools/spdx.py --fix
        language: system
        require_serial: true

      # 所有文档非口语化
      - id: prose
        name: prose (书面语)
        entry: uv run python tools/prose.py
        language: system
        require_serial: true

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: mypy
        name: mypy (strict)
        entry: uv run mypy py_src tools tests
        language: system
        pass_filenames: false
        types_or: [python, pyi]
