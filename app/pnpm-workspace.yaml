#
# pnpm 的工作区设置。**这个文件存在只为一件事：`overrides`。**
#
# pnpm 10 起设置不再读 `package.json` 的 `pnpm` 字段——写了它只回一条
# `[WARN] The "pnpm" field in package.json is no longer read by pnpm ...
# ignored: "pnpm.overrides"`（实测，pnpm 12.8.1），于是设置的家搬到这里。
#
# 为什么需要一个 override：`source-map-js <1.2.2` 有 high 漏洞
# （GHSA-68fv-2mgg-jv7q，索引化 source-map 段偏移导致的**事件循环拒绝服务**），
# 而树里锁的是 1.2.1。它是**传递依赖**（经 `postcss`，vite 与 stylelint 两侧都在用），
# 改不动上游的声明，故在此顶住下限。到期条件：哪天 `postcss` 自己要求 `>=1.2.2`，
# 这条 override 就删掉（留着只是多一处"为什么"）。
overrides:
  source-map-js: ^1.2.2
